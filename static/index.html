<head>
    <title>scoreboard</title>

    <link
        rel="stylesheet"
        href="./index.css"
    >

    <script
        async
        src="./index.mjs"
        type="module"
    ></script>

    <script
        async
        src="./announcement.mjs"
        type="module"
    ></script>

    <script
        async
        src="./name.mjs"
        type="module"
    ></script>
</head>

<body>
    <div
        id="winnerBanner"
        hidden
    >
        <div class="winnerText">
            <span class="winnerName"></span>
            <span>wins!</span>
        </div>

        <div class="winnerTimer">
            <div class="winnerTimerBar"></div>
        </div>
    </div>


    <nav>
        <div>
            <a
                id="title"
                href="/"
            >
                SCOREBOARD
            </a>

            <a href="/admin.html">
                admin
            </a>
        </div>


        <div id="navStatus">
            <p id="playerIdentity">
                you:
                <span id="myPlayerName">
                    name
                </span>

                <input
                    id="playerNameInput"
                    type="text"
                    maxlength="32"
                    autocomplete="off"
                    spellcheck="false"
                    hidden
                >
            </p>

            <p id="np">
                Now playing:
                <span id="playing">dev</span>
            </p>
        </div>
    </nav>


    <div id="pageBody">
        <div id="selectPlayer">
            <template id="playerOption">
                <div onclick="becomePlayer(event)">
                    <div class="mytest"></div>

                    <p class="name"></p>
                </div>
            </template>

            <script
                async
                type="module"
                src="./player.mjs"
            ></script>
        </div>


        <div id="mainView">
            <div id="scores">
                <table>
                    <thead>
                        <tr>
                            <th>Player Name</th>
                            <th>Player Team</th>
                            <th>Player Score</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template>
                            <tr>
                                <td class="name">
                                    name
                                </td>

                                <td class="team">
                                    team
                                </td>

                                <td class="score">
                                    score
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>


            <div id="teams">
                <table>
                    <tbody>
                        <template>
                            <tr>
                                <td class="teamName"></td>
                                <td class="teamTotalScore"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
