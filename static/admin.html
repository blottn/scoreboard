<head>
    <title>scoreboard admin</title>
    <link rel="stylesheet" href="./index.css"></link>
</head>
<body>
    <nav>
        <div>
            <a id="title" href="/">SCOREBOARD</a>
            <a href="/admin.html">admin</a>
        </div>
        <p id="np">Now playing:<span id="playing">dev</span></p>
    </nav>
    <div id="mainView">
        <div>
            <table>
                <tr>
                    <th>Player Name</th>
                    <th>Player Team</th>
                    <th>Player Score</th>
                </tr>
                <template id="player">
                    <tr>
                        <td class="name">name</td>
                        <td class="team">team</td>
                        <td class="score" contenteditable="true" onkeydown="editScore(event)" onblur="saveScore(event)">75</td>
                    </tr>
                </template>
            </table>
        </div>
        <div id="assigns">
            <template id="assignment">
                <div class="assignee">
                    <p class="name">name</p>
                    <p class="owner">owner</p>
                    <button onclick="logoutUser(event)">Log out</button>
                </div>
            </template>
            <script type="module" src="assign.mjs"></script>
        </div>
    </div>
    <script type="module" src="admin.mjs" async></script>
</body>
