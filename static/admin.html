<head>
    <title>scoreboard admin</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <nav>
        <div>
            <a id="title" href="/">SCOREBOARD</a>
            <a href="/admin.html">admin</a>
        </div>

        <p id="np">
            Now playing:
            <span id="playing">dev</span>
        </p>
    </nav>

    <div id="pageBody">
        <div id="mainView">
            <div id="players">
                <table>
                    <thead>
                        <tr>
                            <th>Player Name</th>
                            <th>Player Team</th>
                            <th>Player Score</th>
                            <th>Del</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template id="player">
                            <tr>
                                <td class="name" contenteditable="true" onkeydown="editName(event)" onblur="saveName(event)">name</td>

                                <td class="team">
                                    <select class="teamSelect"></select>
                                </td>
                                <td
                                    class="score"
                                    contenteditable="true"
                                    onkeydown="editScore(event)"
                                    onblur="saveScore(event)"
                                >75</td>
                                <td class="delete" onclick="deletePlayer(event)">
                                    XXX
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <script src="addPlayer.mjs" type="module"></script>
                <button id="addPlayer" onclick="addPlayer(event)">ADD PLAYER</button>
            </div>

            <div id="teamManager">
                <div class="adminPanelHeader">
                    <h2>Teams</h2>
                </div>

                <div id="teams">
                    <template id="team">
                        <div class="teamAdmin">
                            <input
                                class="teamColor"
                                type="color"
                                value="#ffffff"
                                title="Team color"
                            >

                            <span class="teamName">Team</span>

                            <button
                                class="deleteTeam"
                                onclick="deleteTeam(event)"
                            >
                                Delete
                            </button>
                        </div>
                    </template>
                </div>

                <form id="createTeam">
                    <input
                        id="newTeamName"
                        type="text"
                        placeholder="Team name"
                        maxlength="32"
                        autocomplete="off"
                        required
                    >

                    <input
                        id="newTeamColor"
                        type="color"
                        value="#ffffff"
                        title="Team color"
                    >

                    <button type="submit">
                        Create team
                    </button>
                </form>
            </div>

            <div id="controlPanel">
                <div class="adminPanelHeader">
                    <h2>Control Panel</h2>
                </div>

                <div id="winnerControls">
                    <label for="winnerSelect">
                        Winner
                    </label>

                    <select id="winnerSelect">
                        <option value="">
                            Select a winner
                        </option>
                    </select>

                    <button id="announceWinner">
                        Announce Winner
                    </button>
                </div>
            </div>

        </div>
    </div>
    <script type="module" src="./admin.mjs"></script>
</body>
